<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
  /* ===== NAVBAR STYLES ===== */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    transition: all 0.3s ease;
    padding: 1rem 0;
    background: transparent;
}

.navbar-scrolled {
    background: rgba(10, 14, 26, 0.8);
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.navbar-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Logo */
.navbar-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    font-family: "Audiowide", sans-serif;
    font-size: 1.5rem;
    transition: transform 0.3s ease;
}

.navbar-logo:hover {
    transform: scale(1.05);
}

.logo-image {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #FFD75E;
    box-shadow: 0 0 10px rgba(255, 215, 94, 0.3);
}

.logo-text-container {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}

.logo-text {
    color: #f5f7fa;
    font-weight: 700;
}

.logo-ai {
    background: linear-gradient(135deg, #e8b84d 0%, #d4a843 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
}

/* Desktop Navigation */
.nav-menu {
    display: flex;
    align-items: center;
    gap: 2rem;
    list-style: none;
    margin: 0;
    padding: 0;
}

.nav-item {
    position: relative;
}

.nav-link {
    color: #f5f7fa;
    text-decoration: none;
    font-family: "Exo 2", sans-serif;
    font-size: 1rem;
    font-weight: 500;
    transition: color 0.3s ease;
    position: relative;
    padding: 0.5rem 0;
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(135deg, #e8b84d 0%, #d4a843 100%);
    transition: width 0.3s ease;
}

.nav-link:hover {
    color: #FFD75E;
}

.nav-link:hover::after {
    width: 100%;
}

.nav-link-cta {
    background: linear-gradient(135deg, #e8b84d 0%, #d4a843 100%);
    color: #0a0e1a;
    padding: 0.6rem 1.25rem;
    border-radius: 8px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(232, 184, 77, 0.25);
    transition: all 0.3s ease;
}

.nav-link-cta::after {
    display: none;
}

.nav-link-cta:hover {
    color: #0a0e1a;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(232, 184, 77, 0.4);
}

/* Desktop Socials */
.navbar-socials {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.social-link {
    color: #b8c1db;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
}

.social-link:hover {
    color: #FFD75E;
    background: rgba(255, 215, 94, 0.1);
    transform: translateY(-2px);
}

/* Mobile Menu Toggle */
.mobile-menu-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 24px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 102;
    position: relative;
}

.hamburger-line {
    width: 100%;
    height: 3px;
    background: #f5f7fa;
    border-radius: 2px;
    transition: all 0.3s ease;
    transform-origin: center;
}

.mobile-menu-toggle.active .hamburger-line:nth-child(1) {
    transform: translateY(10.5px) rotate(45deg);
}

.mobile-menu-toggle.active .hamburger-line:nth-child(2) {
    opacity: 0;
}

.mobile-menu-toggle.active .hamburger-line:nth-child(3) {
    transform: translateY(-10.5px) rotate(-45deg);
}

/* Mobile Menu Overlay */
.mobile-menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: rgba(10, 14, 26, 0.7);
    backdrop-filter: blur(5px);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 98;
}

.mobile-menu-overlay.active {
    opacity: 1;
    visibility: visible;
}

/* Mobile Menu Sidebar */
.mobile-menu-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    max-width: 80%;
    height: 100vh;
    background: rgba(15, 23, 41, 0.95);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 215, 94, 0.2);
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 101;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    overflow-y: auto;
}

.mobile-menu-sidebar.active {
    transform: translateX(0);
}

/* Mobile Menu Header */
.mobile-menu-header {
    padding: 1.5rem;
    border-bottom: 1px solid rgba(255, 215, 94, 0.1);
}

.mobile-logo {
    display: flex;
    align-items: center;

.mobile-logo .logo-image {

}

/* Mobile Navigation */
.mobile-nav-menu {
    list-style: none;
    padding: 0;
    margin: 0;
    flex: 1;
}

.mobile-nav-item {
    margin: 0;
}

.mobile-nav-link {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    color: #f5f7fa;

    font-family: "Exo 2", sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    transition: all 0.3s ease;
    border-left: 3px solid transparent;
}

.mobile-nav-link:hover,
.mobile-nav-link:active {
    background: rgba(255, 215, 94, 0.1);
    border-left-color: #FFD75E;
    color: #FFD75E;
}

.mobile-nav-icon {
    font-size: 1.3rem;
    width: 24px;
    display: inline-block;
    text-align: center;
}

.mobile-nav-link-cta {
    margin: 1rem 1.5rem;
    padding: 0.85rem 1.5rem;
    background: linear-gradient(135deg, #e8b84d 0%, #d4a843 100%);
    color: #0a0e1a;
    border-radius: 8px;
    font-weight: 600;
    text-align: center;
    border-left: none;
    box-shadow: 0 4px 12px rgba(232, 184, 77, 0.25);
}

.mobile-nav-link-cta:hover {
    background: linear-gradient(135deg, #f4c864 0%, #e8b84d 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(232, 184, 77, 0.4);
}

/* Mobile Socials */
.mobile-socials {
    padding: 1.5rem;
    border-top: 1px solid rgba(255, 215, 94, 0.1);
}

.mobile-socials-title {
    font-family: "Exo 2", sans-serif;
    font-size: 0.9rem;
    color: #b8c1db;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.mobile-social-links {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.mobile-social-link {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 215, 94, 0.1);
    border: 1px solid rgba(255, 215, 94, 0.2);
    border-radius: 50%;
    color: #FFD75E;
    transition: all 0.3s ease;
}

.mobile-social-link:hover {
    background: rgba(255, 215, 94, 0.2);
    border-color: #FFD75E;
    transform: scale(1.1);
    box-shadow: 0 0 20px rgba(255, 215, 94, 0.3);
}

/* ===== NAVBAR RESPONSIVE STYLES ===== */
@media (max-width: 992px) {
    .nav-menu {
        display: none;
    }

    .navbar-socials {
        display: none;
    }

    .mobile-menu-toggle {
        display: flex;
    }
}

@media (max-width: 768px) {
    .navbar-container {
        padding: 0 1.5rem;
    }

    .navbar-logo {
        font-size: 1.3rem;
    }

    .mobile-menu-sidebar {
        width: 260px;
    }
}

@media (max-width: 576px) {

    }

    .navbar-logo {
        font-size: 1.2rem;
    }

    .logo-image {

    .mobile-menu-sidebar {

    .mobile-nav-link {
        font-size: 1rem;
        padding: 0.85rem 1.25rem;
    }

        font-size: 1.2rem;
    }

@media (max-width: 380px) {

        padding: 0.75rem 1rem;
    }

    .mobile-logo {
        font-size: 1.3rem;
    }
}

    <script>
            // ===== NAVBAR FUNCTIONALITY =====
    const navbar = document.getElementById('navbar');
    const mobileToggle = document.getElementById('mobileToggle');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobileSidebar = document.getElementById('mobileSidebar');
    
    // Navbar scroll effect
    function handleNavbarScroll() {
        if (window.scrollY > 50) {
            navbar.classList.add('navbar-scrolled');
        } else {
            navbar.classList.remove('navbar-scrolled');
        }
    }
    
    // Mobile menu toggle
    function toggleMobileMenu() {
        const isActive = mobileToggle.classList.contains('active');
        
        if (isActive) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }
    }
    
    function openMobileMenu() {
        mobileToggle.classList.add('active');
        mobileOverlay.classList.add('active');
        mobileSidebar.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    
    function closeMobileMenu() {
        mobileToggle.classList.remove('active');
        mobileOverlay.classList.remove('active');
        mobileSidebar.classList.remove('active');
        document.body.style.overflow = 'unset';
    }
    
    // Event listeners for navbar
    window.addEventListener('scroll', handleNavbarScroll);
    mobileToggle.addEventListener('click', toggleMobileMenu);
    mobileOverlay.addEventListener('click', closeMobileMenu);
    
    // Close mobile menu when clicking on navigation links
    const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
    mobileNavLinks.forEach(link => {
        link.addEventListener('click', closeMobileMenu);
    });
    </script>
